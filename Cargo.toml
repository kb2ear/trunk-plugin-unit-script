[package]
# Your plugin's id: lowercase letters, digits and dashes. It names the
# executable, the release files and the plugin's entry in the registry.
name = "unit-script"
version = "0.1.0"
edition = "2024"
description = "Runs a Trunk Recorder-style unitScript for radio registrations, affiliations, locations and calls."
license = "MIT"
repository = "https://github.com/kb2ear/trunk-plugin-unit-script"
authors = ["Scott Weis <kb2ear@kb2ear.net>"]
publish = false

[dependencies]
trunk-recorder-plugin = "0.5.0"
# The settings form is drawn from your config structs' JSON Schema. Keep the
# major version the SDK uses (1).
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
